<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Seite nicht gefunden – JobInsides</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="stylesheet" href="/tokens.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Plus Jakarta Sans',sans-serif;background:var(--bg-soft);color:var(--ink);
       min-height:100vh;display:flex;align-items:center;justify-content:center;padding:1.5rem}
  .karte{background:#fff;border:1px solid var(--border);border-radius:28px;padding:3rem 2.25rem;
         max-width:460px;width:100%;text-align:center;box-shadow:var(--shadow-lg)}
  .marke{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:1.25rem;margin-bottom:2rem}
  .marke span{color:var(--accent)}
  .zahl{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:4.5rem;line-height:1;
        color:var(--accent);letter-spacing:-.04em;margin-bottom:.75rem}
  h1{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:1.5rem;margin-bottom:.6rem}
  p{color:var(--muted);line-height:1.6;margin-bottom:1.75rem}
  a{display:inline-flex;align-items:center;justify-content:center;min-height:48px;
    background:var(--accent);color:#fff;text-decoration:none;padding:.85rem 2rem;border-radius:99px;font-weight:700}
  a:hover{background:var(--accent-deep)}
</style>
</head>
<body>
  <div class="karte">
    <div class="marke">Job<span>Insides</span></div>
    <div class="zahl">404</div>
    <h1>Diese Seite gibt es nicht</h1>
    <p>Vielleicht hat sich die Adresse geändert oder es war ein Tippfehler. Über die Suche findest du jeden Beruf.</p>
    <a href="/">Zur Berufssuche</a>
  </div>
</body>
</html>
