<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JobInsides – Berufe Import Tool</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  body {
    font-family: -apple-system, system-ui, sans-serif;
    max-width: 700px; margin: 40px auto; padding: 0 20px;
    background: #f7f4ef; color: #1a1714; line-height: 1.6;
  }
  h1 { font-size: 1.6rem; }
  .box {
    background: #fff; border: 1px solid #e0d9cf;
    border-radius: 12px; padding: 1.5rem; margin: 1rem 0;
  }
  button {
    background: #c8401a; color: #fff; border: none;
    padding: .8rem 1.8rem; border-radius: 8px;
    font-size: 1rem; font-weight: 600; cursor: pointer;
  }
  button:disabled { opacity: .5; cursor: not-allowed; }
  .log {
    background: #1a1714; color: #4ade80;
    border-radius: 8px; padding: 1rem; margin-top: 1rem;
    font-family: monospace; font-size: .85rem;
    max-height: 400px; overflow-y: auto; white-space: pre-wrap;
  }
  .progress-bar {
    height: 24px; background: #e8e2d8; border-radius: 99px;
    overflow: hidden; margin: 1rem 0;
  }
  .progress-fill {
    height: 100%; background: linear-gradient(90deg, #2a6ef5, #c8401a);
    width: 0%; transition: width .3s; border-radius: 99px;
    display: flex; align-items: center; justify-content: center;
    color: #fff; font-size: .75rem; font-weight: 600;
  }
  .stat { font-size: 2rem; font-weight: 800; color: #c8401a; }
</style>
</head>
<body>
  <h1>🔧 JobInsides – Berufe Import</h1>
  <p>Dieses Tool lädt alle Berufe aus der BERUFENET Datenbank der Bundesagentur für Arbeit in deine Supabase-Datenbank. Du brauchst es nur einmal auszuführen (und später gelegentlich für Updates).</p>

  <div class="box">
    <strong>Status:</strong> <span id="status">Bereit</span>
    <div class="progress-bar"><div class="progress-fill" id="progress">0%</div></div>
    <div><span class="stat" id="count">0</span> Berufe importiert</div>
  </div>

  <button id="startBtn" onclick="startImport()">Import starten</button>

  <div class="log" id="log">Warte auf Start…</div>

<script>
// ════════════════════════════════════════
// KONFIGURATION
// ════════════════════════════════════════
const SUPABASE_URL = 'https://kvqdgcixmdnrarlaskyb.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imt2cWRnY2l4bWRucmFybGFza3liIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU5NzUwMTQsImV4cCI6MjA5MTU1MTAxNH0.ngU8OG7cFC7ZWRrt0ZxlUBDIbtv-cEa-rFJbjZII2wk';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

// BERUFENET API – direkter Aufruf
// WICHTIG: Dieses Tool muss auf Netlify (jobinsides.de) laufen, nicht lokal!
const KEY = 'infosysbub-berufenet';
function buildUrl(berufsgruppe, page) {
  return `https://rest.arbeitsagentur.de/infosysbub/bnet/pc/v1/berufe?berufsgruppe=${berufsgruppe}&page=${page}`;
}

// Berufsgruppen die wir importieren
const BERUFSGRUPPEN = {
  '100': 'Ausbildungsberuf',
  '101': 'Ausbildungsberuf',
  '102': 'Ausbildungsberuf',
  '200': 'Weiterbildung',
  '201': 'Weiterbildung',
  '203': 'Weiterbildung',
  '204': 'Weiterbildung',
  '300': 'Studium',
  '301': 'Studium',
  '302': 'Studium',
  '400': 'Hochschulberuf',
  '401': 'Hochschulberuf',
  '402': 'Hochschulberuf',
  '700': 'Tätigkeitsfeld'
};

function log(msg) {
  const el = document.getElementById('log');
  el.textContent += '\n' + msg;
  el.scrollTop = el.scrollHeight;
}

function setStatus(s) { document.getElementById('status').textContent = s; }
function setProgress(pct) {
  const el = document.getElementById('progress');
  el.style.width = pct + '%';
  el.textContent = pct + '%';
}
function setCount(n) { document.getElementById('count').textContent = n; }

async function startImport() {
  document.getElementById('startBtn').disabled = true;
  setStatus('Importiere…');
  log('Import gestartet…');

  let alleBerufe = new Map(); // dedupliziert per name+gruppe
  const gruppen = Object.keys(BERUFSGRUPPEN);

  for (let gi = 0; gi < gruppen.length; gi++) {
    const gruppe = gruppen[gi];
    const gruppenName = BERUFSGRUPPEN[gruppe];
    let page = 0;
    let hasMore = true;

    log(`\n📂 Lade Berufsgruppe ${gruppe} (${gruppenName})…`);

    while (hasMore) {
      try {
        const url = buildUrl(gruppe, page);
        const res = await fetch(url, { headers: { 'X-API-Key': KEY } });

        if (!res.ok) { log(`  ⚠️ Seite ${page}: HTTP ${res.status}`); break; }

        const data = await res.json();
        const berufe = data?.berufe || data?.content || [];

        if (!berufe.length) { hasMore = false; break; }

        for (const b of berufe) {
          const name = b.kurzBezeichnungNeutral || b.bezeichnung || b.name;
          if (!name) continue;
          const key = name + '|' + gruppenName;
          if (!alleBerufe.has(key)) {
            alleBerufe.set(key, {
              dkz_id: String(b.id || b.dkzId || ''),
              name: name,
              berufsgruppe: gruppenName,
              kategorie: b.berufsfeld || b.berufecluster || null,
              name_lower: name.toLowerCase()
            });
          }
        }

        log(`  Seite ${page}: ${berufe.length} Berufe (gesamt: ${alleBerufe.size})`);
        setCount(alleBerufe.size);
        page++;

        // Sicherheit: max 50 Seiten pro Gruppe
        if (page > 50) { hasMore = false; }

      } catch (err) {
        log(`  ❌ Fehler: ${err.message}`);
        hasMore = false;
      }
    }

    setProgress(Math.round((gi + 1) / gruppen.length * 100));
  }

  log(`\n✅ ${alleBerufe.size} eindeutige Berufe gefunden. Speichere in Supabase…`);

  // In Batches von 100 speichern
  const berufeArray = [...alleBerufe.values()];
  let gespeichert = 0;

  for (let i = 0; i < berufeArray.length; i += 100) {
    const batch = berufeArray.slice(i, i + 100);
    const { error } = await sb.from('berufe').upsert(batch, { onConflict: 'name,berufsgruppe' });

    if (error) {
      log(`  ❌ Batch-Fehler: ${error.message}`);
    } else {
      gespeichert += batch.length;
      log(`  💾 ${gespeichert}/${berufeArray.length} gespeichert`);
    }
  }

  setStatus('✅ Fertig!');
  log(`\n🎉 Import abgeschlossen! ${gespeichert} Berufe in deiner Datenbank.`);
  document.getElementById('startBtn').disabled = false;
}
</script>
</body>
</html>
