<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1b1a"/>
      <stop offset="100%" stop-color="#14322e"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.85" cy="0.15" r="0.6">
      <stop offset="0%" stop-color="#00bfa6" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#00bfa6" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Wortmarke -->
  <text x="90" y="150"
        font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
        font-size="46" font-weight="800" fill="#ffffff" letter-spacing="-1">
    Job<tspan fill="#2ee6a8">Insides</tspan>
  </text>

  <!-- Claim -->
  <text x="90" y="310"
        font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
        font-size="82" font-weight="800" fill="#ffffff" letter-spacing="-2">
    Was dein Job
  </text>
  <text x="90" y="400"
        font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
        font-size="82" font-weight="800" letter-spacing="-2">
    <tspan fill="#2ee6a8">wirklich</tspan><tspan fill="#ffffff"> bedeutet.</tspan>
  </text>

  <!-- Unterzeile -->
  <text x="90" y="472"
        font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
        font-size="30" fill="#9fb3ad">
    Echte Bewertungen von Menschen, die den Job bereits machen.
  </text>

  <!-- Hinweis-Pille -->
  <rect x="90" y="516" width="330" height="54" rx="27"
        fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.16"/>
  <text x="120" y="551"
        font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
        font-size="24" fill="#ffffff" fill-opacity="0.85">
    100% anonym · ohne Account
  </text>
</svg>
